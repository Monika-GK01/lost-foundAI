version: "3.9"

services:
  # ─── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: lostfound-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: campus_lost_found
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── AI Service (FastAPI) ─────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lostfound-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=ViT-B-32
      - PRETRAINED=laion2b_s34b_b79k
      - DEVICE=cpu
      - DEBUG=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Backend (Express) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lostfound-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/campus_lost_found?authSource=admin
      - CLIENT_URL=http://localhost:3000
      - JWT_ACCESS_SECRET=change-this-access-secret-in-production
      - JWT_REFRESH_SECRET=change-this-refresh-secret-in-production
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
      - AI_SERVICE_URL=http://ai-service:8000
      - CLOUDINARY_CLOUD_NAME=
      - CLOUDINARY_API_KEY=
      - CLOUDINARY_API_SECRET=
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - EMAIL_FROM=noreply@campuslostfound.io
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started

  # ─── Frontend (Nginx) ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lostfound-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
